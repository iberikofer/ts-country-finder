<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Outer Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Vibrant Pin Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for Pin -->
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Subtle Globe Meridians & Latitude Lines in Background -->
  <circle cx="32" cy="32" r="22" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25"/>
  <ellipse cx="32" cy="32" rx="12" ry="22" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25"/>

  <!-- Pin Shadow on Base -->
  <ellipse cx="32" cy="54" rx="8" ry="2.5" fill="#000000" opacity="0.4"/>

  <!-- Prominent Large Location Pin -->
  <g filter="url(#pinShadow)">
    <path
      d="M32 10
         C22.611 10 15 17.611 15 27
         C15 37.8 28.5 49.5 31.05 51.65
         C31.6 52.12 32.4 52.12 32.95 51.65
         C35.5 49.5 49 37.8 49 27
         C49 17.611 41.389 10 32 10 Z"
      fill="url(#pinGrad)"
    />
    <!-- Pin Core Cutout / Eye -->
    <circle cx="32" cy="26" r="6" fill="#0b1120"/>
    <circle cx="32" cy="26" r="3.2" fill="#38bdf8"/>
  </g>
</svg>
